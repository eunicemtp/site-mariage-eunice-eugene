<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Aperçu du template email RSVP</title>
</head>
<body style="margin:0;">
<!--
  APERÇU LOCAL UNIQUEMENT (ce fichier n'est pas utilisé par le site).
  Pour EmailJS : copiez uniquement le <table> ci-dessous (pas le
  <!DOCTYPE>/<head>/<body>) dans l'onglet "Content" du template,
  en mode édition HTML/code.

  Variables utilisées : {{nom}}, {{presence}}, {{nombre_personnes}}, {{message}}
  Champ "To email" du template (onglet Settings) : mtpeunice@gmail.com
  Champ "Subject" du template : RSVP Mariage — {{nom}}
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F1ECE2; padding:32px 16px; font-family:Georgia, 'Times New Roman', serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background-color:#FAF6F0; border-radius:14px; overflow:hidden; border:1px solid #E3DACB;">

        <!-- En-tête -->
        <tr>
          <td align="center" style="background-color:#8A9A80; padding:36px 24px;">
            <div style="font-family:Georgia, 'Times New Roman', serif; font-size:14px; letter-spacing:3px; text-transform:uppercase; color:#E4D3B8; margin-bottom:10px;">
              Nouvelle réponse RSVP
            </div>
            <div style="font-family:Georgia, 'Times New Roman', serif; font-size:32px; color:#ffffff;">
              Eunice <span style="color:#E4D3B8; font-style:italic;">&amp;</span> Eugène
            </div>
          </td>
        </tr>

        <!-- Corps -->
        <tr>
          <td style="padding:32px 28px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="padding:14px 0; border-bottom:1px solid #E3DACB;">
                  <div style="font-family:Arial, sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#6E6858; margin-bottom:4px;">Nom et prénom(s)</div>
                  <div style="font-family:Arial, sans-serif; font-size:17px; color:#3A362F; font-weight:bold;">{{nom}}</div>
                </td>
              </tr>
              <tr>
                <td style="padding:14px 0; border-bottom:1px solid #E3DACB;">
                  <div style="font-family:Arial, sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#6E6858; margin-bottom:4px;">Présence</div>
                  <div style="font-family:Arial, sans-serif; font-size:17px; color:#66765D; font-weight:bold;">{{presence}}</div>
                </td>
              </tr>
              <tr>
                <td style="padding:14px 0; border-bottom:1px solid #E3DACB;">
                  <div style="font-family:Arial, sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#6E6858; margin-bottom:4px;">Nombre de personnes</div>
                  <div style="font-family:Arial, sans-serif; font-size:17px; color:#3A362F; font-weight:bold;">{{nombre_personnes}}</div>
                </td>
              </tr>
              <tr>
                <td style="padding:14px 0;">
                  <div style="font-family:Arial, sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#6E6858; margin-bottom:4px;">Message</div>
                  <div style="font-family:Arial, sans-serif; font-size:15px; color:#3A362F; line-height:1.6; font-style:italic;">« {{message}} »</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Pied -->
        <tr>
          <td align="center" style="background-color:#3A362F; padding:20px 24px;">
            <div style="font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:13px; color:#E4D3B8;">
              « Que l'homme donc ne sépare pas ce que Dieu a joint. » — Marc 10:9
            </div>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
